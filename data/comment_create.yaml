comment_create:
  - id: "COMM-CRT-001"
    description: "正常评论"
    preconditions: ["logged_in", "post_exists"]
    request:
      method: POST
      url: "/comments"
      headers:
        Authorization: "Bearer {{token}}"
      body:
        post_id: "{{post_id}}"
        content: "这是一条评论"
    expected:
      status_code: 200
      ret: 0
      msg: "评论成功"

  - id: "COMM-CRT-002"
    description: "评论内容为空"
    preconditions: ["logged_in", "post_exists"]
    request:
      method: POST
      url: "/comments"
      headers:
        Authorization: "Bearer {{token}}"
      body:
        post_id: "{{post_id}}"
        content: ""
    expected:
      status_code: 400
      ret: 1
      msg: "评论内容不能为空"

  - id: "COMM-CRT-003"
    description: "未登录评论"
    preconditions: ["post_exists"]
    request:
      method: POST
      url: "/comments"
      body:
        post_id: "{{post_id}}"
        content: "评论"
    expected:
      status_code: 401
      ret: 1
      msg: "未授权"

  - id: "COMM-CRT-004"
    description: "评论不存在的文章"
    preconditions: ["logged_in"]
    request:
      method: POST
      url: "/comments"
      headers:
        Authorization: "Bearer {{token}}"
      body:
        post_id: 99999
        content: "评论"
    expected:
      status_code: 404
      ret: 1
      msg: "文章不存在"
